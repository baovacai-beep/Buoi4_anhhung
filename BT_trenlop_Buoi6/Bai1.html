<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        figure {
            transform: skew(-20deg);
            filter: blur(5px) hue-rotate(60deg) saturate(2);
        }

        .BIT {
            background-color: #146d37;
            transition-property: all;
            transition-duration: 10s;
            transition-timing-function: ease-out;
            transition-delay: 0s;
        }

        .BIT:hover {
            background-color: #bf1d2d;
            width: 200%;
            height: 40px;
        }

        div.at-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .at-item {
            color: #3079ed;
            font-weight: bold;
            font-size: 3em;
            animation-name: text-shadow-multicolor2;
            animation-duration: 2.2s;
            animation-timing-function: ease-in;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            animation-fill-mode: forwards;
        }

        @keyframes text-shadow-multicolor2 {
            0% {
                text-shadow: 0 0 black, 0 0 red, 
                0 0 orange, 0 0 yellow, 0 0 green, 
                0 0 skyblue, 0 0 blue, 0 0 white;
                transform: translateX(0) translateY(0);
            }

            100% {
                text-shadow: -1px -1px black, 
                -3px -3px red,
                -5px -5px orange, 
                -7px -7px yellow,
                -9px -9px green, 
                -11px -11px skyblue,
                -13px -13px blue, 
                -15px -15px white;
                transform: translateX(8px) translateY(8px);
            }
        }

        @keyframes backend-bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-30px);
            }

            60% {
                transform: translateY(-15px);
            }
        }

        #backend {
            animation: backend-bounce 1s infinite !important;
        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

</head>

<body>

    <figure>
        <img width="200" src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png">
        <figcaption>BIT</figcaption>
    </figure>

    <button class="BIT">BIT</button>

    <button class="hvr-wobble-to-top-right hvr-rectangle-out">PTUDTMDT</button>

    <div class="at-container">
        <div class="at-item">ĐẠI HỌC UEH</div>
    </div>

    <button id="backend" class="animate__animated animate__bounce animate__infinite">BACKEND</button>

</body>
</html>
